[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "latsimpkg"
version = "0.1.0"
description = "Hamiltonian lattice simulations of bosonized (1+1)-dimensional gauge theories and their bound states"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
include = ["latsimpkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["slow: teure Tests mit grossem N"]
addopts = "-m 'not slow'"